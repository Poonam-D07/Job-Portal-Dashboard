<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TalentSphere - Startup-grade Job Portal candidate dashboard. Search open technical vacancies, track real-time applications, and visualize salary metrics.">
  <meta name="keywords" content="jobs, dashboard, candidate portal, application tracker, resume dashboard, tech careers">
  <meta name="author" content="TalentSphere Inc.">
  <meta name="theme-color" content="#07080a">
  
  <title>TalentSphere - Job Portal Dashboard</title>
  
  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Base CSS Layout Sheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/global.css">
  
  <!-- UI Components Stylesheets -->
  <link rel="stylesheet" href="css/components/sidebar.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/modal.css">
  <link rel="stylesheet" href="css/components/charts.css">
  <link rel="stylesheet" href="css/components/toast.css">
  
  <!-- View Pages Stylesheets -->
  <link rel="stylesheet" href="css/pages/dashboard.css">
  <link rel="stylesheet" href="css/pages/jobs.css">
</head>
<body>
  
  <!-- Boot Loader -->
  <div class="app-boot-loader" id="appBootLoader">
    <div class="loader-spinner"></div>
    <span class="loader-text">TalentSphere</span>
  </div>

  <!-- Dashboard Main Grid Frame -->
  <div class="app-container" id="appContainer">
    
    <!-- Sidebar navigation drawer -->
    <aside class="app-sidebar" id="appSidebar" aria-label="Main Navigation"></aside>
    
    <!-- Header panel with search and profile info -->
    <header class="app-header" id="appHeader" aria-label="Header Panel"></header>
    
    <!-- Main dynamic pages router mount -->
    <main class="app-main" id="appMain" role="main"></main>
    
  </div>
  
  <!-- ES6 Core Javascript Module Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
